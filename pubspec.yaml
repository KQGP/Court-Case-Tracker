name: court_case_tracker
description: "Court Case Folder Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.5

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Connectivity
  connectivity_plus: ^6.1.3

  # QR Code
  qr_flutter: ^4.1.0

  # PDF & Printing
  pdf: ^3.11.3
  printing: ^5.13.4

  # Deep Links
  app_links: ^6.3.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_slidable: ^3.1.1
  firebase_auth: ^5.7.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
